<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>Employee Management System</title>
    <link href="employee-component.css" rel="stylesheet">
    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/3.4.1/css/bootstrap.min.css">
    <script src="./AjaxScript.js">

    </script>
</head>

<body>
    <div class="header">
        <h2>Employee Management System</h2>
    </div>
    <br>
    <form #employeeForm="ngForm">
        <div class="content">
            <table class="table-hover">
                <tr>
                    <td>Employee ID :</td>
                    <td><input type="number" name="eid" id="eid" #eid="ngModel" ngModel /><br></td>

                </tr>
                <tr>
                    <td>Employee Name :</td>
                    <td><input type="text" name="ename" id="ename" #ename="ngModel" ngModel /><br></td>
                </tr>
                <tr>
                    <td>Employee Salary :</td>
                    <td><input type="number" name="esalary" id="esalary" #esalary="ngModel" ngModel /><br></td>
                </tr>
                <tr>
                    <td>Department Number :</td>
                    <td><input type="number" name="dno" id="dno" #dno="ngModel" ngModel /><br></td>
                </tr>
            </table>
            <br> <input type="button" value="Save" class="btn-primary" name="emsButton"
                (click)="saveEmployee(employeeForm.value)" /> &nbsp;&nbsp; <input type="button" value="Update"
                class="btn-warning" name="emsButton" (click)="updateEmployee(employeeForm.value)" /> &nbsp;&nbsp;
            <input type="button" value="Delete" class="btn-danger" name="emsButton"
                (click)="deleteEmployee(employeeForm.value.eid)" /> &nbsp;&nbsp; <input type="button" value="Find"
                class="btn-success" name="emsButton" (click)="findEmployee(employeeForm.value.eid)" /> &nbsp;&nbsp;
            <input type="button" value="FindAll" class="btn-info" name="emsButton" (click)="findAllEmployees()" />
            <br>

        </div>
    </form>
    <div class="alert alert-info">
        <b>{{result}}</b>

    </div>

    <table class="table table-bordered table-hover" *ngIf="employees.length > 0">
  <thead>
    <tr>
      <th>Employee ID</th>
      <th>Employee Name</th>
      <th>Salary</th>
      <th>Department No.</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let employee of employees">
      <td>{{ employee.eid }}</td>
      <td>{{ employee.ename }}</td>
      <td>{{ employee.esalary }}</td>
      <td>{{ employee.dno }}</td>
    </tr>
  </tbody>
</table>

</body>

</html>
