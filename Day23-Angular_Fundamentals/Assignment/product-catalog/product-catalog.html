<h2>Product Catalog</h2>

<table border="1" cellpadding="8">

  <tr>
    <th>S.No</th>
    <th>Product Id</th>
    <th>Product Name</th>
    <th>Category</th>
    <th>Price</th>
  </tr>

  <tr *ngFor="let product of products; let i = index; let even = even"
      [style.backgroundColor]="even ? 'lightblue' : 'lightyellow'">

    <td>{{ i + 1 }}</td>
    <td>{{ product.pid }}</td>
    <td>{{ product.pname }}</td>
    <td>{{ product.category }}</td>
    <td>{{ product.price }}</td>

  </tr>

</table>
